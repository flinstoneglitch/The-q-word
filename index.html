<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>The Q Word</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding-top: 40px;
    }

    h1 { margin-bottom: 5px; }

    input {
      font-size: 20px;
      padding: 10px;
      width: 160px;
      text-align: center;
      text-transform: lowercase;
    }

    button {
      padding: 10px 15px;
      margin-left: 10px;
      cursor: pointer;
    }

    .row {
      font-size: 24px;
      letter-spacing: 4px;
      margin: 8px;
    }

    #board {
      margin-top: 20px;
    }

    #share {
      margin-top: 20px;
      white-space: pre;
      background: #1a1f33;
      display: inline-block;
      padding: 10px;
    }
  </style>




</head>

<body>

<h1>⚛️ The Q Word</h1>
<p>Daily quantum-seeded word puzzle</p>

<input id="guess" maxlength="5" />
<button onclick="submitGuess()">Guess</button>

<div id="board"></div>
<div id="share"></div>

<script>

// --------------------
// WORD LIST
// --------------------
const WORDS = [
  "orbit","phase","quark","laser","field",
  "force","decay","pulse","gauge","spine",
  "entropy","fusion","vector","lattice",
  "chaos","light","prism","trace","stone"
].filter(w => w.length === 5);

// --------------------
// DAILY SEED (simple deterministic "quantum-like" seed)
// --------------------
function seed() {
  const today = new Date().toISOString().slice(0,10);
  let h = 0;
  for (let i = 0; i < today.length; i++) {
    h = (h * 31 + today.charCodeAt(i)) >>> 0;
  }
  return h;
}

// --------------------
// PICK WORD
// ====================

let qentropyData = null;
let target = WORDS[0];

function fallbackSeed() {
  const today = new Date().toISOString().slice(0,10);
  let h = 0;
  for (let i = 0; i < today.length; i++) {
    h = (h * 31 + today.charCodeAt(i)) >>> 0;
  }
  return h;
}

function hexToBits(hex) {
  return hex
    .slice(0, 16)
    .split("")
    .map(ch => parseInt(ch, 16).toString(2).padStart(4, "0"))
    .join("")
    .slice(0, 8);
}

function drawBitBlocks(seed) {
  const old = document.getElementById("qentropy-bitstream");
  if (old) old.remove();

  const footer = document.querySelector(".seed-footer") || document.body;

  const wrap = document.createElement("div");
  wrap.id = "qentropy-bitstream";
  wrap.style.display = "flex";
  wrap.style.justifyContent = "center";
  wrap.style.gap = "8px";
  wrap.style.marginTop = "12px";
  wrap.style.flexWrap = "wrap";

  const bits = hexToBits(seed);

  for (const bit of bits) {
    const box = document.createElement("div");
    box.textContent = bit;
    box.style.width = "42px";
    box.style.height = "42px";
    box.style.border = "2px solid #9dff57";
    box.style.borderRadius = "10px";
    box.style.display = "flex";
    box.style.alignItems = "center";
    box.style.justifyContent = "center";
    box.style.color = "#9dff57";
    box.style.fontFamily = "monospace";
    box.style.fontSize = "20px";
    box.style.fontWeight = "bold";
    box.style.background = "rgba(255,255,255,.04)";
    box.style.boxShadow = "0 0 12px rgba(157,255,87,.45)";
    wrap.appendChild(box);
  }

  
const powered=document.querySelector('[id="qentropy-hardware"]') || footer;
powered.parentNode.appendChild(wrap);

}

function addQentropyBadge() {
  if (document.getElementById("qentropy-badge")) return;

  const badge = document.createElement("div");
  badge.id = "qentropy-badge";
  badge.textContent = "⚛ Powered by QeNTROPY Engine";
  badge.style.textAlign = "center";
  badge.style.marginTop = "12px";
  badge.style.color = "#ff4dff";
  badge.style.fontWeight = "bold";
  badge.style.textShadow = "0 0 10px #ff4dff";

  const footer = document.querySelector(".seed-footer") || document.body;
  footer.appendChild(badge);
}

async function loadQEntropyWord() {
  const today = new Date().toISOString().slice(0,10);
  const cacheKey = `qentropy_daily_seed_${today}`;

  let seed = localStorage.getItem(cacheKey);

  try {
    if (!seed) {
      const response = await fetch(
        "https://q-runtime.onrender.com/api/seed?source=hybrid",
        {
          headers: {
            "x-api-key": "qentropy-demo-key"
          }
        }
      );

      const data = await response.json();
      qentropyData = data;
      seed = data.seed;

      localStorage.setItem(cacheKey, seed);
    }

    const seedNumber = parseInt(seed.slice(0, 8), 16);
    target = WORDS[seedNumber % WORDS.length];

    drawBitBlocks(seed);
    addQentropyBadge();

    console.log("QeNTROPY Daily Seed:", seed);
    console.log("Today's Word:", target);

  } catch (err) {
    const localSeed = fallbackSeed();
    target = WORDS[localSeed % WORDS.length];

    console.log("QeNTROPY unavailable, fallback word:", target);
  }
}

loadQEntropyWord();

// SCORE FUNCTION
// --------------------
function scoreGuess(g, t) {
  let result = Array(5).fill("⬛");
  let temp = t.split("");

  for (let i = 0; i < 5; i++) {
    if (g[i] === t[i]) {
      result[i] = "🟩";
      temp[i] = null;
    }
  }

  for (let i = 0; i < 5; i++) {
    if (result[i] === "⬛" && temp.includes(g[i])) {
      result[i] = "🟨";
      temp[temp.indexOf(g[i])] = null;
    }
  }

  return result.join("");
}

// --------------------
// GAME STATE
// --------------------
let attempts = [];

// --------------------
// SUBMIT GUESS
// --------------------
function submitGuess() {
  const input = document.getElementById("guess");
  const guess = input.value.toLowerCase();

  if (guess.length !== 5) return;

  const score = scoreGuess(guess, target);
  attempts.push(score);

  document.getElementById("board").innerHTML =
    attempts.map(a => `<div class="row">${a}</div>`).join("");

  document.getElementById("share").innerText = attempts.join("\n");

  input.value = "";

  if (guess === target) {
    alert("Quantum collapse complete!");
  }

  if (attempts.length === 6) {
    alert("Game over. Word was: " + target);
  }
}

</script>












<style id="qentropy-final-bit-size">
  #qentropy-bitstream{
    margin-top:8px !important;
    gap:5px !important;
  }
  #qentropy-bitstream div{
    width:21px !important;
    height:21px !important;
    font-size:12px !important;
    border-radius:5px !important;
    border-width:1px !important;
  }
</style>

<script id="delete-row-directly-above-powered">
(function(){
  function visible(el){
    if(!el) return false;
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    return r.width > 5 &&
           r.height > 5 &&
           cs.display !== "none" &&
           cs.visibility !== "hidden" &&
           cs.opacity !== "0";
  }

  function hide(el){
    if(!el || el === document.body || el === document.documentElement) return;
    el.style.setProperty("display","none","important");
    el.style.setProperty("visibility","hidden","important");
    el.style.setProperty("opacity","0","important");
    el.style.setProperty("height","0","important");
    el.style.setProperty("max-height","0","important");
    el.style.setProperty("margin","0","important");
    el.style.setProperty("padding","0","important");
    el.style.setProperty("overflow","hidden","important");
  }

  function cleanup(){
    const powered = Array.from(document.querySelectorAll("body *"))
      .filter(visible)
      .find(el => /Powered by QeNTROPY Engine/i.test(el.textContent || ""));

    if(!powered) return;

    const poweredTop = powered.getBoundingClientRect().top;
    const centerX = window.innerWidth / 2;

    const qbits = document.getElementById("qentropy-bitstream");
    if(qbits){
      powered.insertAdjacentElement("afterend", qbits);
    }

    const candidates = Array.from(document.querySelectorAll("body *"))
      .filter(el => {
        if(!visible(el)) return false;
        if(el === powered || el.contains(powered) || powered.contains(el)) return false;
        if(el.id === "qentropy-bitstream" || el.closest("#qentropy-bitstream")) return false;
        if(el.matches("input,button,script,style,h1,h2,h3")) return false;
        if(el.closest("input,button")) return false;

        const r = el.getBoundingClientRect();
        const mid = r.left + r.width / 2;

        return r.top > 250 &&
               r.bottom < poweredTop - 3 &&
               Math.abs(mid - centerX) < 220 &&
               r.width < 420 &&
               r.height < 170;
      });

    if(!candidates.length) return;

    let nearest = candidates.sort((a,b) =>
      b.getBoundingClientRect().top - a.getBoundingClientRect().top
    )[0];

    const nr = nearest.getBoundingClientRect();

    candidates.forEach(el => {
      const r = el.getBoundingClientRect();
      const sameRow =
        Math.abs((r.top + r.height/2) - (nr.top + nr.height/2)) < 35;

      if(sameRow){
        hide(el);
      }
    });

    let parent = nearest.parentElement;
    while(parent && parent !== document.body){
      const pr = parent.getBoundingClientRect();

      const wrapsNearest =
        pr.top <= nr.top + 10 &&
        pr.bottom >= nr.bottom - 10 &&
        pr.width < 430 &&
        pr.height < 180;

      const safe =
        !parent.contains(powered) &&
        !parent.querySelector("input,button") &&
        !parent.closest("#qentropy-bitstream");

      if(wrapsNearest && safe){
        hide(parent);
        break;
      }

      parent = parent.parentElement;
    }
  }

  window.addEventListener("load", cleanup);
  setTimeout(cleanup, 50);
  setTimeout(cleanup, 250);
  setTimeout(cleanup, 750);
  setTimeout(cleanup, 1500);
  setInterval(cleanup, 1000);
})();
</script>

</body>
</html>

// --------------------
// DAILY SEED helpers — all dates in America/Los_Angeles to match the server
// --------------------
function getLADate() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
}

function fallbackSeed() {
  const today = getLADate();
  let h = 0;
  for (let i = 0; i < today.length; i++) {
    h = (h * 31 + today.charCodeAt(i)) >>> 0;
  }
  return h;
}

// --------------------
// PICK WORD
// ====================

let qentropyData = null;
let target = WORDS[0];

function hexToBits(hex) {
  return hex
    .slice(0, 16)
    .split("")
    .map(ch => parseInt(ch, 16).toString(2).padStart(4, "0"))
    .join("")
    .slice(0, 8);
}

function drawBitBlocks(seed) {
  const old = document.getElementById("qentropy-bitstream");
  if (old) old.remove();

  const footer = document.querySelector(".seed-footer") || document.body;

  const wrap = document.createElement("div");

  wrap.style.justifyContent = "center";
  wrap.style.gap = "8px";
  wrap.style.marginTop = "12px";
  wrap.style.flexWrap = "wrap";

  const bits = hexToBits(seed);

    box.textContent = bit;

    box.style.background = "rgba(255,255,255,.04)";
    box.style.boxShadow = "0 0 12px rgba(157,255,87,.45)";
    wrap.appendChild(box);
  }

  
const powered=document.querySelector('[id="qentropy-hardware"]') || footer;
powered.parentNode.appendChild(wrap);

}

function addQentropyBadge() {
  if (document.getElementById("qentropy-badge")) return;

  const badge = document.createElement("div");

  footer.appendChild(badge);
}


function qentropySeedNumber(seed) {
  const raw = String(seed || "");

  const hex = raw.replace(/[^a-fA-F0-9]/g, "");
  if (hex.length >= 2) {
    return parseInt(hex.slice(0, 8), 16) >>> 0;
  }

  const bits = raw.replace(/[^01]/g, "");
  if (bits.length >= 2) {
    return parseInt(bits.slice(0, 32), 2) >>> 0;
  }

  return fallbackSeed();
}

async function setQuantumBingBackground(seed) {
  try {
    const response = await fetch(
      "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=en-US"
    );

    const data = await response.json();
    const images = data.images || [];

    if (!images.length) return;

    const n = qentropySeedNumber(seed);
    const image = images[n % images.length];

    const imageUrl =
      image.url && image.url.startsWith("http")
        ? image.url
        : "https://www.bing.com" + image.url;

    document.body.classList.add("qentropy-bing-bg");

    document.body.style.backgroundImage =
      `linear-gradient(
        rgba(4, 4, 18, .72),
        rgba(4, 4, 18, .88)

    let credit = document.getElementById("qentropy-bg-credit");

    if (!credit) {
      credit = document.createElement("div");
      credit.id = "qentropy-bg-credit";
      document.body.appendChild(credit);
    }

    credit.textContent =
      `Daily background selected by QeNTROPY seed · ${image.copyright || "Bing daily image"}`;

    console.log("QeNTROPY Background:", imageUrl);
    console.log("QeNTROPY Background Index:", n % images.length);

  } catch (err) {
    console.log("Bing daily background unavailable; keeping default background.");
  }
}


async function loadQEntropyWord() {
  const today = getLADate();
  const cacheKey = `qword_daily_${today}`;

  // (a) QeNTROPY daily endpoint — stable seed cached once per LA calendar day
  try {
    const cached = localStorage.getItem(cacheKey);
    let seedData;

    if (cached) {
      seedData = JSON.parse(cached);
    } else {
      const response = await fetch(
        "https://q-runtime.onrender.com/api/daily-seed?app=qword"
      );
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (!data.ok || !data.seed) throw new Error("bad response");
      seedData = data;
      localStorage.setItem(cacheKey, JSON.stringify(seedData));
    }

    qentropyData = seedData;
    // seed_safe is ≤ 2^52 — safe for Number modulo
    const wordIndex = seedData.seed_safe % WORDS.length;
    target = WORDS[wordIndex];

    drawBitBlocks(seedData.seed);
    addQentropyBadge();

    console.log("Q Word seed source:", seedData);
    return;

  } catch (err) {
    console.log("QeNTROPY daily-seed unavailable:", err.message);
  }

  // (b) Local seed.json — stale but deterministic
  try {
    const response = await fetch("seed.json");
    if (!response.ok) throw new Error("seed.json HTTP " + response.status);
    const data = await response.json();
    if (!data.seed) throw new Error("seed.json missing seed field");
    // seed is a 38-digit decimal integer — must use BigInt to avoid precision loss
    const wordIndex = Number(BigInt(String(data.seed)) % BigInt(WORDS.length));
    target = WORDS[wordIndex];
    console.log("Q Word seed source: seed.json", { date: data.date, seed: String(data.seed) });
    return;

  } catch (err2) {
    console.log("seed.json unavailable:", err2.message);
  }

  // (c) Deterministic LA-date hash — always cross-browser stable, never random
  const localSeed = fallbackSeed();
  target = WORDS[localSeed % WORDS.length];
  console.log("Q Word seed source: local date hash", { date: today, seed: localSeed });
}

loadQEntropyWord();

// SCORE FUNCTION
// --------------------
function scoreGuess(g, t) {
  let result = Array(5).fill("⬛");
  let temp = t.split("");

  for (let i = 0; i < 5; i++) {
    if (g[i] === t[i]) {
      result[i] = "🟩";
      temp[i] = null;
    }
  }

  for (let i = 0; i < 5; i++) {
    if (result[i] === "⬛" && temp.includes(g[i])) {
      result[i] = "🟨";
      temp[temp.indexOf(g[i])] = null;
    }
  }

  return result.join("");
}

// --------------------
// GAME STATE
// --------------------
let attempts = [];

// --------------------
// SUBMIT GUESS
// --------------------
function submitGuess() {
  const input = document.getElementById("guess");
  const guess = input.value.toLowerCase();

  if (guess.length !== 5) return;

  const score = scoreGuess(guess, target);
  attempts.push(score);

  document.getElementById("board").innerHTML =
    attempts.map(a => `<div class="row">${a}</div>`).join("");

  document.getElementById("share").innerText = attempts.join("\n");

  input.value = "";

  if (guess === target) {
    alert("Quantum collapse complete!");
  }

  if (attempts.length === 6) {
    alert("Game over. Word was: " + target);
  }
}

<script id="delete-row-directly-above-powered">
(function(){
  function visible(el){
    if(!el) return false;
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    return r.width > 5 &&
           r.height > 5 &&
           cs.display !== "none" &&
           cs.visibility !== "hidden" &&
           cs.opacity !== "0";
  }

  function hide(el){
    if(!el || el === document.body || el === document.documentElement) return;
    el.style.setProperty("display","none","important");
    el.style.setProperty("visibility","hidden","important");
    el.style.setProperty("opacity","0","important");
    el.style.setProperty("height","0","important");
    el.style.setProperty("max-height","0","important");
    el.style.setProperty("margin","0","important");
    el.style.setProperty("padding","0","important");
    el.style.setProperty("overflow","hidden","important");
  }

  function cleanup(){
    const powered = Array.from(document.querySelectorAll("body *"))
      .filter(visible)
      .find(el => /Powered by QeNTROPY Engine/i.test(el.textContent || ""));

    if(!powered) return;

    const poweredTop = powered.getBoundingClientRect().top;
    const centerX = window.innerWidth / 2;

    const qbits = document.getElementById("qentropy-bitstream");
    if(qbits){
      powered.insertAdjacentElement("afterend", qbits);
    }

    const candidates = Array.from(document.querySelectorAll("body *"))
      .filter(el => {
        if(!visible(el)) return false;
        if(el === powered || el.contains(powered) || powered.contains(el)) return false;
        if(el.id === "qentropy-bitstream" || el.closest("#qentropy-bitstream")) return false;
        if(el.id === "app" || el.closest("#app")) return false;
        if(el.matches("input,button,script,style,h1,h2,h3")) return false;
        if(el.closest("input,button")) return false;

        const r = el.getBoundingClientRect();
        const mid = r.left + r.width / 2;

        return r.top > 250 &&
               r.bottom < poweredTop - 3 &&
               Math.abs(mid - centerX) < 220 &&
               r.width < 420 &&
               r.height < 170;
      });

    if(!candidates.length) return;

    let nearest = candidates.sort((a,b) =>
      b.getBoundingClientRect().top - a.getBoundingClientRect().top
    )[0];

    const nr = nearest.getBoundingClientRect();

    candidates.forEach(el => {
      const r = el.getBoundingClientRect();
      const sameRow =
        Math.abs((r.top + r.height/2) - (nr.top + nr.height/2)) < 35;

      if(sameRow){
        hide(el);
      }
    });

    let parent = nearest.parentElement;
    while(parent && parent !== document.body){
      const pr = parent.getBoundingClientRect();

      const wrapsNearest =
        pr.top <= nr.top + 10 &&
        pr.bottom >= nr.bottom - 10 &&
        pr.width < 430 &&
        pr.height < 180;

      const safe =
        !parent.contains(powered) &&
        !parent.querySelector("input,button") &&
        !parent.closest("#qentropy-bitstream");

      if(wrapsNearest && safe){
        hide(parent);
        break;
      }

      parent = parent.parentElement;
    }
  }

  window.addEventListener("load", cleanup);
  setTimeout(cleanup, 50);
  setTimeout(cleanup, 250);
  setTimeout(cleanup, 750);
  setTimeout(cleanup, 1500);
  setInterval(cleanup, 1000);
})();
</script>

<script id="qentropy-bing-background-final">
(function(){
  const API = "https://q-runtime.onrender.com";

  function today(){
    return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
  }

  function cachedSeed(){
    return localStorage.getItem("qentropy_bg_seed_" + today());
  }

  async function getSeed(){
    let seed = cachedSeed();

    if (seed) return seed;

    const response = await fetch(API + "/api/daily-seed?app=qword");

    const data = await response.json();
    seed = data.seed || "";

    if (seed) {
      localStorage.setItem("qentropy_bg_seed_" + today(), seed);
    }

    return seed;
  }

  async function setBackground(){
    try {
      const seed = await getSeed();

      if (!seed) {
        console.log("QeNTROPY background: no seed found");
        return;
      }

      const response = await fetch(
        API + "/api/bing-background?seed=" + encodeURIComponent(seed)
      );

      const bg = await response.json();

      if (!bg.ok || !bg.image_url) {
        console.log("QeNTROPY background unavailable:", bg);
        return;
      }

      document.body.classList.add("qentropy-bing-bg");

      document.body.style.backgroundImage =
        "linear-gradient(rgba(4,4,18,.28), rgba(4,4,18,.48)), url('" +
        bg.image_url +
        "')";

      let credit = document.getElementById("qentropy-bg-credit");

      if (!credit) {
        credit = document.createElement("div");
        credit.id = "qentropy-bg-credit";
        document.body.appendChild(credit);
      }

      credit.textContent =
        "Daily background selected by QeNTROPY seed · " +
        (bg.copyright || bg.title || "Bing Daily Image");

      console.log("QeNTROPY Bing Background:", bg.image_url);
      console.log("QeNTROPY Background Seed:", seed);
      console.log("QeNTROPY Background Index:", bg.index);

    } catch (err) {
      console.log("QeNTROPY background error:", err);
    }
  }

  window.addEventListener("load", setBackground);
  setTimeout(setBackground, 250);
  setTimeout(setBackground, 1200);
})();
</script>

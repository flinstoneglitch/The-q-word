<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>The Q Word</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding-top: 40px;
    }

    h1 { margin-bottom: 5px; }

    input {
      font-size: 20px;
      padding: 10px;
      width: 160px;
      text-align: center;
      text-transform: lowercase;
    }

    button {
      padding: 10px 15px;
      margin-left: 10px;
      cursor: pointer;
    }

    .row {
      font-size: 24px;
      letter-spacing: 4px;
      margin: 8px;
    }

    #board {
      margin-top: 20px;
    }

    #share {
      margin-top: 20px;
      white-space: pre;
      background: #1a1f33;
      display: inline-block;
      padding: 10px;
    }
  </style>

<style id="qentropy-cleanup">

#qentropy-bitstream div{
  width:21px !important;
  height:21px !important;
  font-size:12px !important;
  border-radius:5px !important;
  border-width:1px !important;
}

/* hide the old duplicate yellow blocks */
body > div[style*="background:#334"],
body > div[style*="background: #334"]{
  display:none !important;
}

</style>


<style id="qentropy-layout-fix">

/* remove old duplicate hint blocks */
body > div[style*="background:#334"],
body > div[style*="background: #334"]{
  display:none !important;
}

/* move qentropy section lower */
#qentropy-bitstream{
  margin-top:12px !important;
}

/* shrink quantum blocks */
#qentropy-bitstream div{
  width:20px !important;
  height:20px !important;
  font-size:11px !important;
  border-radius:4px !important;
  border-width:1px !important;
}

</style>

</head>

<body>

<h1>⚛️ The Q Word</h1>
<p>Daily quantum-seeded word puzzle</p>

<input id="guess" maxlength="5" />
<button onclick="submitGuess()">Guess</button>

<div id="board"></div>
<div id="share"></div>

<script>

// --------------------
// WORD LIST
// --------------------
const WORDS = [
  "orbit","phase","quark","laser","field",
  "force","decay","pulse","gauge","spine",
  "entropy","fusion","vector","lattice",
  "chaos","light","prism","trace","stone"
].filter(w => w.length === 5);

// --------------------
// DAILY SEED (simple deterministic "quantum-like" seed)
// --------------------
function seed() {
  const today = new Date().toISOString().slice(0,10);
  let h = 0;
  for (let i = 0; i < today.length; i++) {
    h = (h * 31 + today.charCodeAt(i)) >>> 0;
  }
  return h;
}

// --------------------
// PICK WORD
// ====================

let qentropyData = null;
let target = WORDS[0];

function fallbackSeed() {
  const today = new Date().toISOString().slice(0,10);
  let h = 0;
  for (let i = 0; i < today.length; i++) {
    h = (h * 31 + today.charCodeAt(i)) >>> 0;
  }
  return h;
}

function hexToBits(hex) {
  return hex
    .slice(0, 16)
    .split("")
    .map(ch => parseInt(ch, 16).toString(2).padStart(4, "0"))
    .join("")
    .slice(0, 8);
}

function drawBitBlocks(seed) {
  const old = document.getElementById("qentropy-bitstream");
  if (old) old.remove();

  const footer = document.querySelector(".seed-footer") || document.body;

  const wrap = document.createElement("div");
  wrap.id = "qentropy-bitstream";
  wrap.style.display = "flex";
  wrap.style.justifyContent = "center";
  wrap.style.gap = "8px";
  wrap.style.marginTop = "12px";
  wrap.style.flexWrap = "wrap";

  const bits = hexToBits(seed);

  for (const bit of bits) {
    const box = document.createElement("div");
    box.textContent = bit;
    box.style.width = "42px";
    box.style.height = "42px";
    box.style.border = "2px solid #9dff57";
    box.style.borderRadius = "10px";
    box.style.display = "flex";
    box.style.alignItems = "center";
    box.style.justifyContent = "center";
    box.style.color = "#9dff57";
    box.style.fontFamily = "monospace";
    box.style.fontSize = "20px";
    box.style.fontWeight = "bold";
    box.style.background = "rgba(255,255,255,.04)";
    box.style.boxShadow = "0 0 12px rgba(157,255,87,.45)";
    wrap.appendChild(box);
  }

  
const powered=document.querySelector('[id="qentropy-hardware"]') || footer;
powered.parentNode.appendChild(wrap);

}

function addQentropyBadge() {
  if (document.getElementById("qentropy-badge")) return;

  const badge = document.createElement("div");
  badge.id = "qentropy-badge";
  badge.textContent = "⚛ Powered by QeNTROPY Engine";
  badge.style.textAlign = "center";
  badge.style.marginTop = "12px";
  badge.style.color = "#ff4dff";
  badge.style.fontWeight = "bold";
  badge.style.textShadow = "0 0 10px #ff4dff";

  const footer = document.querySelector(".seed-footer") || document.body;
  footer.appendChild(badge);
}

async function loadQEntropyWord() {
  const today = new Date().toISOString().slice(0,10);
  const cacheKey = `qentropy_daily_seed_${today}`;

  let seed = localStorage.getItem(cacheKey);

  try {
    if (!seed) {
      const response = await fetch(
        "https://q-runtime.onrender.com/api/seed?source=hybrid",
        {
          headers: {
            "x-api-key": "qentropy-demo-key"
          }
        }
      );

      const data = await response.json();
      qentropyData = data;
      seed = data.seed;

      localStorage.setItem(cacheKey, seed);
    }

    const seedNumber = parseInt(seed.slice(0, 8), 16);
    target = WORDS[seedNumber % WORDS.length];

    drawBitBlocks(seed);
    addQentropyBadge();

    console.log("QeNTROPY Daily Seed:", seed);
    console.log("Today's Word:", target);

  } catch (err) {
    const localSeed = fallbackSeed();
    target = WORDS[localSeed % WORDS.length];

    console.log("QeNTROPY unavailable, fallback word:", target);
  }
}

loadQEntropyWord();

// SCORE FUNCTION
// --------------------
function scoreGuess(g, t) {
  let result = Array(5).fill("⬛");
  let temp = t.split("");

  for (let i = 0; i < 5; i++) {
    if (g[i] === t[i]) {
      result[i] = "🟩";
      temp[i] = null;
    }
  }

  for (let i = 0; i < 5; i++) {
    if (result[i] === "⬛" && temp.includes(g[i])) {
      result[i] = "🟨";
      temp[temp.indexOf(g[i])] = null;
    }
  }

  return result.join("");
}

// --------------------
// GAME STATE
// --------------------
let attempts = [];

// --------------------
// SUBMIT GUESS
// --------------------
function submitGuess() {
  const input = document.getElementById("guess");
  const guess = input.value.toLowerCase();

  if (guess.length !== 5) return;

  const score = scoreGuess(guess, target);
  attempts.push(score);

  document.getElementById("board").innerHTML =
    attempts.map(a => `<div class="row">${a}</div>`).join("");

  document.getElementById("share").innerText = attempts.join("\n");

  input.value = "";

  if (guess === target) {
    alert("Quantum collapse complete!");
  }

  if (attempts.length === 6) {
    alert("Game over. Word was: " + target);
  }
}

</script>


<script id="qentropy-remove-second-hint-row">
(function(){
  function looksLikeSmallHintRow(el){
    if (!el || el.id === "qentropy-bitstream") return false;
    if (el.closest && el.closest("#qentropy-bitstream")) return false;

    const kids = Array.from(el.children || []);
    if (kids.length !== 5) return false;

    return kids.every(k => {
      const r = k.getBoundingClientRect();
      return r.width >= 10 && r.width <= 55 &&
             r.height >= 10 && r.height <= 55;
    });
  }

  function cleanup(){
    const all = Array.from(document.querySelectorAll("div"));
    const rows = all.filter(looksLikeSmallHintRow);

    if (rows.length <= 1) return;

    rows.sort((a,b) =>
      a.getBoundingClientRect().top - b.getBoundingClientRect().top
    );

    rows.forEach((row, i) => {
      if (i === 0) return;   // KEEP TOP HINT ROW
      row.remove();          // REMOVE SECOND / DUPLICATE HINT ROW
    });

    const qbits = document.getElementById("qentropy-bitstream");
    const powered =
      Array.from(document.querySelectorAll("div"))
      .find(el => el.textContent.includes("Powered by QeNTROPY"));

    if (qbits && powered && powered.parentNode) {
      powered.insertAdjacentElement("afterend", qbits);
    }
  }

  window.addEventListener("load", cleanup);
  setTimeout(cleanup, 250);
  setTimeout(cleanup, 1000);
})();
</script>


<script id="nuke-second-small-hint-row">
(function(){
  function isQEntropyBits(el){
    return el.id === "qentropy-bitstream" || el.closest("#qentropy-bitstream");
  }

  function boxScore(el){
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);

    const square =
      r.width >= 14 &&
      r.width <= 60 &&
      r.height >= 14 &&
      r.height <= 60 &&
      Math.abs(r.width - r.height) <= 12;

    const visible =
      cs.display !== "none" &&
      cs.visibility !== "hidden" &&
      r.opacity !== 0 &&
      r.width > 0 &&
      r.height > 0;

    const colored =
      cs.backgroundColor !== "rgba(0, 0, 0, 0)" ||
      cs.borderColor !== "rgba(0, 0, 0, 0)" ||
      cs.boxShadow !== "none";

    return square && visible && colored;
  }

  function findSmallHintRows(){
    const divs = Array.from(document.querySelectorAll("div"))
      .filter(el => !isQEntropyBits(el));

    const rows = [];

    for (const el of divs){
      const kids = Array.from(el.children || []);
      const boxes = kids.filter(boxScore);

      if (boxes.length === 5){
        const r = el.getBoundingClientRect();

        if (
          r.top > 250 &&
          r.top < window.innerHeight * 0.75 &&
          r.width < 260 &&
          r.height < 90
        ){
          rows.push(el);
        }
      }
    }

    rows.sort((a,b) =>
      a.getBoundingClientRect().top - b.getBoundingClientRect().top
    );

    return rows;
  }

  function cleanup(){
    const rows = findSmallHintRows();

    rows.forEach((row, index) => {
      if (index === 0) {
        row.style.display = "";
        row.style.visibility = "";
        row.style.opacity = "";
        return;
      }

      row.remove();
    });

    const powered = Array.from(document.querySelectorAll("div"))
      .find(el => /Powered by QeNTROPY/i.test(el.textContent));

    const qbits = document.getElementById("qentropy-bitstream");

    if (powered && qbits) {
      powered.insertAdjacentElement("afterend", qbits);
    }
  }

  window.addEventListener("load", cleanup);
  setTimeout(cleanup, 100);
  setTimeout(cleanup, 500);
  setTimeout(cleanup, 1200);
  setInterval(cleanup, 2000);
})();
</script>

</body>
</html>

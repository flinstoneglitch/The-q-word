name: Daily Quantum Seed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  generate-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install qiskit qiskit-ibm-runtime
      - name: Generate new seed
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python quantum_seed_job.py
      - name: Commit updated seed
        run: |
          git config user.name "seed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seed.json
          git diff --cached --quiet || git commit -m "daily quantum seed"
          git push

